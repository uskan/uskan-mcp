name: Publish to npm

# Tag a version (v0.1.1) and this publishes the exact same commit to npm, with
# provenance, so the npm package is cryptographically tied to this repo.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing + provenance need a recent npm.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build

      # Fail early if the tag and package.json disagree.
      # Publishing is only ever allowed from a v* tag, and that tag must match
      # package.json. Without this gate a manual (workflow_dispatch) run from any
      # branch could publish unchecked code.
      - name: Require a v* tag that matches package.json
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::publish only runs from a v* tag (got $GITHUB_REF)"; exit 1 ;;
          esac
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != package.json $PKG"; exit 1; }

      # Publish. npm prefers Trusted Publishing (OIDC) when the package has a
      # trusted publisher configured on npmjs.com, and falls back to NPM_TOKEN
      # otherwise. Both paths are kept on purpose: the token is the only thing
      # here with an expiry date, and a release should not fail on the day it
      # lapses.
      - name: Publish
        id: publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A failed publish is almost always the token, and the npm error for that
      # is a bare E401. Say what to actually do.
      - name: Explain an auth failure
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          echo "::error::If this failed with E401/E403, the NPM_TOKEN has most likely expired."
          echo "::error::Fix permanently: npmjs.com -> uskan-mcp -> Settings -> Trusted Publisher"
          echo "::error::  -> GitHub Actions, repo uskan/uskan-mcp, workflow publish.yml"
          echo "::error::Then no token is needed at all. Temporary fix: regenerate a granular"
          echo "::error::access token and update the NPM_TOKEN repo secret."
          exit 1
